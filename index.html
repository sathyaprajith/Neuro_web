<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuro Paradigm — Bridging Neuroscience &amp; Clinical Intelligence</title>
    <meta
      name="description"
      content="AI-assisted clinical decision support for psychiatry and neurodevelopmental care. Structured signal layers — Behavioral, Biological, and Cognitive — to augment specialist-led evaluation."
    />
    <meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/png"
      href="/images/logo.png?v=2"
    />
    <link rel="apple-touch-icon" href="/images/logo.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("np-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
